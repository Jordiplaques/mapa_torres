<script>

var map = L.map("map").setView([40.3, 1.5], 7.3);

var capaMarcadors;
var poblacioCerca = "";
var collesDisponibles = [];
var collaCerca = "";

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

fetch("localitzacions.geojson")

.then(response => response.json())

.then(data => {
    data.features.forEach(function(feature) {

        if (feature.properties.colles_relacionades) {

            feature.properties.colles_relacionades.forEach(function(colla) {

                if (!collesDisponibles.includes(colla)) {
                    collesDisponibles.push(colla);
                }

            });

        }

    });

    collesDisponibles.sort(function(a, b) {
        return a.localeCompare(b);
    });


var numeroCarruselPlaques = 0;

window.canviaPlaca = function(idCarrusel, direccio) {

    var carrusel = document.getElementById(idCarrusel);

    if (!carrusel) {
        return;
    }

    var plaques =
        carrusel.querySelectorAll(".placa-carrusel");

    var actual =
        carrusel.querySelector(".placa-carrusel-activa");

    var indexActual =
        Array.prototype.indexOf.call(plaques, actual);

    var nouIndex =
        indexActual + direccio;

    if (nouIndex < 0) {
        nouIndex = plaques.length - 1;
    }

    if (nouIndex >= plaques.length) {
        nouIndex = 0;
    }

    plaques.forEach(function (placa) {

        placa.classList.remove(
            "placa-carrusel-activa"
        );

    });

    plaques[nouIndex].classList.add(
        "placa-carrusel-activa"
    );

    var comptador =
        carrusel.querySelector(".placa-comptador");

    if (comptador) {

        comptador.textContent =
            (nouIndex + 1) +
            " / " +
            plaques.length;

    }

}











function crearIcona(p) {

    var icona = "";

    var algunElementPatrimonial =

        document.getElementById("f9").checked ||
        document.getElementById("f10").checked ||
        document.getElementById("fplaques").checked ||
        document.getElementById("fmonuments").checked ||
        document.getElementById("fcarrers").checked ||
        document.getElementById("fcolles").checked;


    // CAP ELEMENT PATRIMONIAL SELECCIONAT
    if (!algunElementPatrimonial) {

        return "📍";

    }


    // ELEMENTS PATRIMONIALS SELECCIONATS

var hiHaPlaça9 = p.places9.some(function (plaça) {

    if (!collaCerca) {
        return true;
    }

    return plaça.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (

) {

}
 var hiHaPlaça10 = p.places10.some(function (plaça) {

    }

    return plaça.colla
        .split(",")
        .map(function (c) {

        })
        .includes(collaCerca);

});

) {

    }

var hiHaMonument = p.monuments.some(function (monument) {

var hiHaCarrer = p.carrers.some(function (carrer) {

        return true;
    }

    return colla.nom.trim() === collaCerca.trim();

function compleixFiltres(p) {

    // -------------------------------------------------------------
    // FILTRE DE POBLACIÓ
    // -------------------------------------------------------------

    if (
        poblacioCerca &&
        !p.poblacio
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .includes(
                poblacioCerca
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
            )
    ) {
        return false;
    }


    // -------------------------------------------------------------
    // FILTRE DE COLLA
    // -------------------------------------------------------------

    if (collaCerca) {

        if (
            !p.colles_relacionades ||
            !p.colles_relacionades.includes(collaCerca)
        ) {
            return false;
        }

    }




    // -------------------------------------------------------------
    // TRADICIONS
    // -------------------------------------------------------------

    var algunaTradicioSeleccionada =

        document.getElementById("fcastells").checked ||
        document.getElementById("fmuixerangues").checked ||
        document.getElementById("ffalcons").checked;


    var tradicioSeleccionada = false;


    if (
        document.getElementById("fcastells").checked &&
        p.castells === "Sí"
    ) {
        tradicioSeleccionada = true;
    }

    if (
        document.getElementById("fmuixerangues").checked &&
        p.muixerangues === "Sí"
    ) {
        tradicioSeleccionada = true;
    }

    if (
        document.getElementById("ffalcons").checked &&
        p.falcons === "Sí"
    ) {
        tradicioSeleccionada = true;
    }


    // -------------------------------------------------------------
    // CAP TRADICIÓ SELECCIONADA
    // -------------------------------------------------------------

    // Si no hi ha cap tradició seleccionada,
    // no mostrem cap localització.
    //
    // Això és així encara que hi hagi elements
    // patrimonials seleccionats.

    if (!algunaTradicioSeleccionada) {
        return false;
    }


    // La localització ha de pertànyer a
    // almenys una de les tradicions seleccionades.

    if (!tradicioSeleccionada) {
        return false;
    }


    // -------------------------------------------------------------
    // ELEMENTS PATRIMONIALS
    // -------------------------------------------------------------

    var algunElementSeleccionat =

        document.getElementById("f9").checked ||
        document.getElementById("f10").checked ||
        document.getElementById("fplaques").checked ||
        document.getElementById("fmonuments").checked ||
        document.getElementById("fcarrers").checked ||
        document.getElementById("fcolles").checked;


    // -------------------------------------------------------------
    // CAP ELEMENT PATRIMONIAL SELECCIONAT
    // -------------------------------------------------------------

    // Si no hi ha cap element seleccionat,
    // ja n'hi ha prou amb complir la tradició.

    if (!algunElementSeleccionat) {
        return true;
    }


    // -------------------------------------------------------------
    // COMPROVEM ELS ELEMENTS PATRIMONIALS
    // -------------------------------------------------------------

    var categoriaSeleccionada = false;


var hiHaPlaça9Filtrada = p.places9.some(function (plaça) {

    if (!collaCerca) {
        return true;
    }

    return plaça.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (
    document.getElementById("f9").checked &&
    hiHaPlaça9Filtrada
) {
    categoriaSeleccionada = true;
}

var hiHaPlaça10Filtrada = p.places10.some(function (plaça) {

    if (!collaCerca) {
        return true;
    }

    return plaça.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (
    document.getElementById("f10").checked &&
    hiHaPlaça10Filtrada
) {
    categoriaSeleccionada = true;
}
var hiHaPlaquesFiltrades = p.plaques.some(function (placa) {

    if (!collaCerca) {
        return true;
    }

    return placa.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (
    document.getElementById("fplaques").checked &&
    hiHaPlaquesFiltrades
) {
    categoriaSeleccionada = true;
}

var hiHaMonumentsFiltrats = p.monuments.some(function (monument) {

    if (!collaCerca) {
        return true;
    }

    return monument.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (
    document.getElementById("fmonuments").checked &&
    hiHaMonumentsFiltrats
) {
    categoriaSeleccionada = true;
}

var hiHaCarrersFiltrats = p.carrers.some(function (carrer) {

    if (!collaCerca) {
        return true;
    }

    return carrer.colla
        .split(",")
        .map(function (c) {
            return c.trim();
        })
        .includes(collaCerca);

});

if (
    document.getElementById("fcarrers").checked &&
    hiHaCarrersFiltrats
) {
    categoriaSeleccionada = true;
}

var hiHaCollesFiltrades = p.colles.some(function (colla) {

    if (!collaCerca) {
        return true;
    }

    return colla.nom === collaCerca;

});

if (
    document.getElementById("fcolles").checked &&
    hiHaCollesFiltrades
) {
    categoriaSeleccionada = true;
}


    // -------------------------------------------------------------
    // RESULTAT FINAL
    // -------------------------------------------------------------

    return categoriaSeleccionada;

}

 capaMarcadors = L.geoJSON(data, {

    filter: function(feature) {

        return compleixFiltres(
            feature.properties
        );

    },

    pointToLayer: function(feature, latlng) {

        var p = feature.properties;

        var icona = crearIcona(p);
        
        return L.marker(
            latlng,
            {
                icon: L.divIcon({

                    className: "icona-personalitzada",

                    iconSize: [40, 20]

        );

            }

                            }

                            if (foto.font && foto.font.trim()) {

                                html += "<br><strong>Font:</strong> ";

                                if (
                                    foto.font_url &&

                                    html += "<a href=\"" +

                                        "\" target=\"_blank\">" +

                                } else {

                                }

                            }

                            if (
                                foto.llicencia &&

                                html += "<br><strong>Llicència:</strong> ";

                                if (

                                        "</a>";

                                } else {

                                    html += foto.llicencia;

                                }

                            }

                            html += "</li>";

                        }


                        // FOTO EXTERNA
                        else if (
                            foto.enllac_extern &&
                            foto.enllac_extern.trim()
                        ) {

                            var textEnllac =
                                foto.text &&
                                foto.text.trim()
                                    ? foto.text
                                    : "Veure fotografia";

                            html += "<li>🔗 " +
                                "<a href=\"" +
                                foto.enllac_extern +
                                "\" target=\"_blank\">" +
                                textEnllac +
                                "</a>" +
                                "</li>";

                        }

                    });

                    html += "</ul>";

                }

            }

           if (p.places9.length) {

    html += "<li><b>9️⃣ Plaça de 9</b></li>";

    html += "<ul>";

    p.places9.forEach(function(placa) {

        html += "<li>";

        html += "<strong>" +

        html += "</li>";

    });

    html += "</ul>";

}

                else if (

document
    .getElementById("cercaColla")
    .addEventListener(
        "input",
        function() {

            var text = this.value.trim();

            var contenidor =
                document.getElementById("resultatsColles");

            contenidor.innerHTML = "";

            if (!text) {
                collaCerca = "";
                return;
            }

            var textNormalitzat =
                text
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase();

            var resultats =
                collesDisponibles.filter(function(colla) {

                    return colla
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .toLowerCase()
                        .includes(textNormalitzat);

                });

            resultats.forEach(function(colla) {

                var boto =
                    document.createElement("button");

                boto.textContent = colla;

                boto.style.display = "block";
                boto.style.width = "180px";
                boto.style.textAlign = "left";
                boto.style.marginBottom = "2px";
                boto.style.cursor = "pointer";

                boto.addEventListener(
                    "click",
                    function() {

                        collaCerca = colla;

                        document
                            .getElementById("cercaColla")
                            .value = colla;

                        contenidor.innerHTML = "";

                        document
                            .getElementById("fcastells")
                            .dispatchEvent(
                                new Event("change")
                            );

                        if (
                            capaMarcadors &&
                            capaMarcadors.getBounds().isValid()
                        ) {

                            map.fitBounds(
                                capaMarcadors.getBounds()
                            );

                        }

                    }
                );

                contenidor.appendChild(boto);
            });

        }
    );
